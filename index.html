<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ブラウザキャッシュ無効化 (Web 変更が即時反映されるように) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="app-version" content="20260425-232348">
  <link rel="icon" href="./favicon.ico">
  <title>Burst Motion — 設定アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "preact":       "https://esm.sh/preact@10.22.0",
      "preact/hooks": "https://esm.sh/preact@10.22.0/hooks",
      "htm":          "https://esm.sh/htm@3.1.1",
      "three":        "https://esm.sh/three@0.160.0"
    }
  }
  </script>
  <!-- esp-web-tools: ブラウザから ESP32 への FW 書込み (要 HTTPS) -->
  <script type="module" src="https://unpkg.com/esp-web-tools@10.0.0/dist/web/install-button.js?module"></script>
  <style>
    body { font-family: 'Hiragino Sans', 'Meiryo', system-ui, sans-serif; }
    .chip { display:inline-block; padding:2px 8px; border-radius:9999px; font-size:11px; }
    .log-line { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app" class="min-h-screen"></div>
  <!-- ?v= はキャッシュバスティング、deploy 時に自動でタイムスタンプに置換される -->
  <script type="module" src="./src/app.js?v=20260425-232348"></script>
</body>
</html>
