; proto_wand_to_led / proto_mag-let-wand_to_candle
; ろうそく(受信側): フォトTRで「杖 ADMGLW の可視光」を検出 → wake → D0/D1 HIGH で LED 点灯
;   → 30秒(今は)で自動消灯 → deep sleep。低消費は D2(LOW) の wake で実現。
;
; 同一 src/main.cpp で 3 ボード対応 (#ifdef でプラットフォーム分岐):
;   XIAO nRF52840 / XIAO ESP32-C3 / XIAO ESP32-C6
; 各ボードに「簡易(=USB観測, deep sleepしない)」と「_lowpower(=deep sleep + D2 wake)」を用意。
;
; ビルド/書込み手順は BUILD.md、設計根拠は ../magic_wand_candle_system_gpt.md を参照。

; ===== XIAO nRF52840 (本命・最低待機電流 ~1.5µA) =====
[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit TinyUSB Library
lib_ignore =
    SdFat - Adafruit Fork

[env:seeed_xiao_nrf52840_lowpower]
extends = env:seeed_xiao_nrf52840
build_flags = -DLOWPOWER_SYSTEMOFF=1

; ===== XIAO ESP32-C3 (BLE/WiFi, deep sleep ~5µA。D2=GPIO4 が wake 対象) =====
;   ⚠ C6 env は arduino-esp32 3.x / espressif32 platform 6.6+ が必要 (latest を自動取得)
;   C3 は公式 espressif32@6.5.0(arduino-esp32 2.0.x・toolchain同梱) にピン留め
;     = idf_tools 不要で確実にビルド可 (git-bash/MSYS 起因の install 破損を回避)。
;     最新(BLE5新機能等)が要れば platform = espressif32 に戻す。
[env:seeed_xiao_esp32c3]
platform = espressif32@6.5.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial を USB(CDC)に

[env:seeed_xiao_esp32c3_lowpower]
extends = env:seeed_xiao_esp32c3
build_flags = ${env:seeed_xiao_esp32c3.build_flags} -DLOWPOWER_SYSTEMOFF=1

; ===== XIAO ESP32-C6 (BLE/WiFi6/Thread, deep sleep ~7µA。D2=GPIO2 が LP_GPIO wake 対象) =====
[env:seeed_xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:seeed_xiao_esp32c6_lowpower]
extends = env:seeed_xiao_esp32c6
build_flags = ${env:seeed_xiao_esp32c6.build_flags} -DLOWPOWER_SYSTEMOFF=1
