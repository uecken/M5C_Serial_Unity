; proto_wand_to_led / led_xiao_esp32c3_ws2812b
; LED 受信機 (空中の魔法演出用): XIAO ESP32-C3 + NimBLE scan + WS2812B (NeoPixel)
;   杖の BLE Advertising (company_id=0xFFFF) を受信 → 呪文ごとに WS2812B 演出。
;   ケース外設置・WS2812B は外部 5V 給電 (電池制約なし)。
;   ※ ESP32 の RMT でハードウェアタイミング生成するため WS2812B 駆動が安定。
;   ※ データ線は 3.3V→5V レベルシフタ推奨 + 5V電源とC3のGNDを共通化。

[env:seeed_xiao_esp32c3]
platform = espressif32@6.6.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.1
    adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
    -D USE_NIMBLE
    -D CORE_DEBUG_LEVEL=0
