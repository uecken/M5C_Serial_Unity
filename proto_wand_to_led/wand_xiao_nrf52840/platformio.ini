; proto_wand_to_led / wand_xiao_nrf52840
; 杖 (送信側): XIAO nRF52840 Sense + 内蔵 LSM6DS3TR-C + Bluefruit Advertising Beacon
; Phase 0 相当: 常時 ON でジェスチャ検出 → BLE adv 500ms burst (sleep/WOM はスコープ外)
;
; ジェスチャ判定は ../shared/wand_gesture.h を M5StickC 版と共用。
; ワイヤフォーマットは ../shared/beacon_protocol.h (受信側 led_xiao_nrf52840 と相互運用)。

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense   ; Sense 版 (variant=Seeed_XIAO_nRF52840_Sense, 内蔵 IMU)
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit TinyUSB Library

; SdFat の File 型が Adafruit_LittleFS の File と衝突するため除外 (led 側と同じ)
lib_ignore =
    SdFat - Adafruit Fork
