; proto_wand_to_led / wand_m5stickc
; 杖 (送信側): M5StickC + MPU6886 + NimBLE Advertising Beacon
; 重力基準フリック検出 (Lumos/Nox/Incendio/Shake) + 30s 静止 deep sleep
;
; env:
;   m5stick-c     … 通常版 (wake = Button A)
;   m5stick-c-wom … 加速度 wake 実験版 (wake = MPU6886 WOM, GPIO35)

[env:m5stick-c]
platform = espressif32@6.6.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.1
build_flags =
    -std=gnu++17
    -D USE_NIMBLE
    -D CORE_DEBUG_LEVEL=0
build_unflags =
    -std=gnu++11

; --- 加速度 wake-on-motion 実験版 (MPU6886 WOM で deep sleep から wake) ---
; device_config.h の ENABLE_IMU_WOM_WAKE を build_flag で上書き (1=有効)
[env:m5stick-c-wom]
extends = env:m5stick-c
build_flags =
    -std=gnu++17
    -D USE_NIMBLE
    -D CORE_DEBUG_LEVEL=0
    -D ENABLE_IMU_WOM_WAKE=1
