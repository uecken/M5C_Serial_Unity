; proto_wand_to_led / wand_m5stickc
; 杖 (送信側): M5StickC + MPU6886 + NimBLE Advertising Beacon
; Phase 0: シンプル shake (|a| > 2.5g) 検出 → 500ms adv burst

[env:m5stick-c]
platform = espressif32@6.6.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.1
build_flags =
    -std=gnu++17
    -D USE_NIMBLE
    -D CORE_DEBUG_LEVEL=0
build_unflags =
    -std=gnu++11
