; proto_wand_to_led / led_xiao_nrf52840
; LED (受信側): XIAO nRF52840 + Bluefruit + 内蔵 LED
; Phase 0: 連続スキャン (100% wake)、ManufacturerData 検出で LED 5 秒点灯

[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit TinyUSB Library

; SdFat の File 型が Adafruit_LittleFS の File と衝突するため除外
lib_ignore =
    SdFat - Adafruit Fork
