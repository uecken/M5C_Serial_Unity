; PlatformIO Project Configuration File — Burst Motion
; https://docs.platformio.org/page/projectconf.html

[platformio]
#build_cache_dir = .pio/build_cache

; ==========================================================
; 共通設定（全 env が継承）
; ==========================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
upload_speed = 1500000

; ==========================================================
; [env:m5stick-c] Legacy v1 (既存 FW、arduino-esp32 2.0.14)
; 9aabaef の build 問題は platform v55(pioarduino fork) を回避するため
; v6.6.0 に明示ピン留めで解決
; ==========================================================
[env:m5stick-c]
platform = espressif32@6.6.0
board = m5stick-c
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.1
build_flags =
lib_ignore =

; ==========================================================
; [env:m5stick-c-v2] Burst Motion 新 FW (Phase 1+)
; 新 core/ + hal/esp32/ + hid/ + transport/ のみビルド
; main_v2.cpp が entry point
; ==========================================================
[env:m5stick-c-v2]
platform = espressif32@6.6.0
board = m5stick-c
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.1
    bblanchon/ArduinoJson @ ^7.0.0
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D USE_NIMBLE
    -D BOARD_M5STICKC
    -D IMU_TYPE_MPU6886
    -D FW_VERSION=\"2.0.0-dev\"
    -D SERIAL_BAUD=115200
monitor_speed = 115200
build_src_filter =
    +<core/>
    +<hal/esp32/>
    +<hid/>
    +<transport/>
    +<main_v2.cpp>
lib_ignore =
    M5StickC
    illumiTrack

; ==========================================================
; [env:esp32c3] Legacy XIAO ESP32-C3
; ==========================================================
[env:esp32c3]
platform = espressif32@6.6.0
board = seeed_xiao_esp32c3
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.1
build_flags =
	-D USE_NIMBLE
	-D ESP32C3
lib_ignore =
	M5StickC

; ==========================================================
; [env:esp32s3] Legacy XIAO ESP32-S3
; ==========================================================
[env:esp32s3]
platform = espressif32@6.6.0
board = seeed_xiao_esp32s3
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.1
build_flags =
	-D USE_NIMBLE
	-D ESP32S3
	-DCORE_DEBUG_LEVEL=5
lib_ignore =
	M5StickC

; ==========================================================
; [env:m5atom-s3-v2] Burst Motion 新 FW、M5Atom S3 (ESP32-S3)
; USB HID + BLE HID + TinyUSB composite
; ==========================================================
[env:m5atom-s3-v2]
platform = espressif32@6.6.0
board = m5stack-atoms3
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.1
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -D USE_NIMBLE
    -D BOARD_M5ATOM_S3
    -D IMU_TYPE_MPU6886
    -D USB_HID_ENABLE
    -D FW_VERSION=\"2.0.0-dev\"
    -D SERIAL_BAUD=921600
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<core/>
    +<hal/esp32/>
    +<hid/>
    +<transport/>
    +<main_v2.cpp>
board_upload.use_1200bps_touch = yes
lib_ignore =
    M5StickC
