; proto_m5stickc_ws2812b
; M5StickC (ESP32) で WS2812B を駆動するスタンドアロン + 魔法受信機。
;   - Button A / Serial で点灯・色・個数・電流上限を操作 (NVS 永続化)
;   - BLE Advertising の魔法ビーコン (proto_wand_to_led の 杖) を SCAN 受信し、
;     spell ごとに色/エフェクトを切り替える (shared/beacon_protocol.h を共用)
;   - WiFi は将来用フック (env:m5stick-c-wifi で -D ENABLE_WIFI)。今は stub。
;
; 配線・電流の根拠は README.md / docs/ を参照。データピンは G26 (DATA_PIN)。

[env:m5stick-c]
platform = espressif32@6.6.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    fastled/FastLED @ ^3.7.0
    h2zero/NimBLE-Arduino @ ~1.4.1      ; BLE scan 受信用 (杖と同じ 1.4.3 に解決)
build_flags =
    -std=gnu++17
    -D USE_NIMBLE
    -D CORE_DEBUG_LEVEL=0
    -D FASTLED_RMT_MAX_CHANNELS=1       ; 1 ストリップのみ。RMT/BT 競合の余地を減らす
build_unflags =
    -std=gnu++11

; --- WiFi 経路を将来有効化する実験 env (今は stub のみ。ビルド確認用) ---
[env:m5stick-c-wifi]
extends = env:m5stick-c
build_flags =
    ${env:m5stick-c.build_flags}
    -D ENABLE_WIFI=1
